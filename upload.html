<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Hotel Credit Risk System</title>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(to bottom right, #0D1A29, #131C3B);
      font-family: 'Urbanist', sans-serif;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }

    .navbar {
      position: sticky;
      top: 0;
      background: rgba(13, 26, 41, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .navbar-container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
    }

    .logo .accent {
      color: #FFC93C;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
      padding: 0;
    }

    .nav-links li a {
      color: #ffffff;
      text-decoration: none;
    }

    .nav-cta {
      background-color: #2940D3;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      background: rgba(255,255,255,0.03);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .container h2 {
      margin-bottom: 20px;
      font-size: 26px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 8px;
      color: white;
    }

    input[type="file"] {
      border: none;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #2940D3;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .footer {
      background-color: #0D1A29;
      color: #BDC5D1;
      padding: 60px 20px;
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="logo">Smart<span class="accent">Credit</span></div>
      <ul class="nav-links">
        <li><a href="#login">Login</a></li>
        <li><a href="#upload">Upload</a></li>
        <li><a href="log.html">Dashboard</a></li>
      </ul>
      <a href="index.html" class="nav-cta">Get Started</a>
    </div>
  </nav>

  <!-- Login Section -->
  <div class="container" id="login">
    <h2>Hotel Login</h2>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" />

    <button>Login</button>
  </div>

  <!-- Upload Section -->
  <div class="container" id="upload">
    <h2>Hotel Data Upload</h2>
    <label for="hotel-name">Hotel Name</label>
    <input type="text" id="hotel-name" />

    <label for="location">Location</label>
    <input type="text" id="location" />

    <label for="rooms">Rooms Occupied</label>
    <input type="text" id="rooms" />

    <label for="performance">Upload Performance File</label>
    <input type="file" id="performance" />

    <button>Submit</button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    © 2025 SmartCredit. All rights reserved.
  </footer>
</body>
</html>
